[project]
name = "minimal"
version = "0.0.1"
description = "Toy project at my-robot's scale: three parts, one assembly, one MJCF scene, one study"
authors = [
    { name = "Sandro Covo", email = "sandro@sandrocovo.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "build123d>=0.13,<0.14",
    "mujoco>=3.15.0",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "workbench-kernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
workbench-kernel = { path = "../../packages/kernel", editable = true }

[tool.workbench]
manifest = "minimal.manifest"
