[tool.uv.workspace]
members = ["packages/*"]
# examples/minimal is its own uv project (not a workspace member): it mirrors my-robot
# at toy scale, with its own lockfile and environment, so the hub and kernel packages
# never pull in build123d or mujoco.
exclude = ["examples/minimal"]

[tool.uv.sources]
workbench = { workspace = true }
workbench-kernel = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "workbench",
    "workbench-kernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
