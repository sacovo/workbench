[tool.uv.workspace]
members = ["packages/hub"]
# examples/minimal is its own uv project (not a workspace member): it mirrors my-robot
# at toy scale, with its own lockfile and environment. The kernel depends on build123d and
# runs inside a project's environment, so it is installed and tested there
# (examples/minimal, my-robot), not in this root environment, which holds only the hub. It is
# not a workspace member, because uv installs every member of a workspace without a root project.
exclude = ["examples/minimal", "packages/kernel"]

[tool.uv.sources]
workbench = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "workbench",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# On all cores (pytest-xdist); idle workers take tests from busy files. `-n 0` runs serially. The hook's
# latency budgets (marker `timing`) are measured on a quiet machine, not beside busy workers, so the
# default run leaves them out: run them with `pytest -q -m timing -n 0` (a later -m replaces this one).
addopts = "-n auto --dist worksteal -m 'not timing'"
markers = ["timing: wall-clock latency against a budget (agentlink.budgets); run alone, `-m timing -n 0`"]
