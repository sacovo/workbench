[project]
name = "workbench"
version = "0.0.1"
description = "Workbench hub: the wbench CLI and the local app server with its page"
authors = [
    { name = "Sandro Covo", email = "sandro@sandrocovo.ch" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
wbench = "workbench.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
